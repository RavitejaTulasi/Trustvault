version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: trustvault_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustvault_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set}"
      STORAGE_DIR: /app/private_storage
      MAX_FILE_SIZE_BYTES: "${MAX_FILE_SIZE_BYTES:-10485760}"
      MAX_MULTIPART_OVERHEAD_BYTES: "${MAX_MULTIPART_OVERHEAD_BYTES:-1048576}"
      MAX_JSON_BODY_BYTES: "${MAX_JSON_BODY_BYTES:-65536}"
      STORAGE_ORPHAN_GRACE_SECONDS: "${STORAGE_ORPHAN_GRACE_SECONDS:-3600}"
      MAX_USER_STORAGE_BYTES: "${MAX_USER_STORAGE_BYTES:-104857600}"
      MAX_GLOBAL_STORAGE_BYTES: "${MAX_GLOBAL_STORAGE_BYTES:-1073741824}"
      MAX_UPLOADS_PER_USER: "${MAX_UPLOADS_PER_USER:-1000}"
      AUDIT_RETENTION_DAYS: "${AUDIT_RETENTION_DAYS:-2555}"
      AUDIT_RETENTION_AUTO_DELETE: "false"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_HTTPONLY: "true"
      SESSION_COOKIE_SAMESITE: "lax"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      # Provision this separately administered PostgreSQL target and schema;
      # do not point it at the application database.
      AUDIT_ANCHOR_MODE: postgresql
      AUDIT_ANCHOR_DATABASE_URL: "${AUDIT_ANCHOR_DATABASE_URL:?AUDIT_ANCHOR_DATABASE_URL must be set}"
      AUDIT_ANCHOR_HMAC_KEY: "${AUDIT_ANCHOR_HMAC_KEY:?AUDIT_ANCHOR_HMAC_KEY must be set}"
      AUDIT_CHECKPOINT_INTERVAL_SECONDS: "${AUDIT_CHECKPOINT_INTERVAL_SECONDS:-3600}"
      AUDIT_CHECKPOINT_MAX_AGE_SECONDS: "${AUDIT_CHECKPOINT_MAX_AGE_SECONDS:-7200}"
      # This Compose service publishes the backend directly. Leave this empty
      # unless a trusted reverse proxy is placed in front of it.
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
      LOGIN_RATE_LIMIT_MAX_BUCKETS: "${LOGIN_RATE_LIMIT_MAX_BUCKETS:-50000}"
    volumes:
      - private_storage_data:/app/private_storage
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  private_storage_data:
