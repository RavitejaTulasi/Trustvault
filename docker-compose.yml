version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: trustvault_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustvault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustvault_password}
      POSTGRES_DB: ${POSTGRES_DB:-trustvault_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustvault_user} -d ${POSTGRES_DB:-trustvault_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustvault_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trustvault_user}:${POSTGRES_PASSWORD:-trustvault_password}@db:5432/${POSTGRES_DB:-trustvault_db}
      SECRET_KEY: ${SECRET_KEY:-insecure_dev_secret_please_change_in_production_32bytes}
      STORAGE_DIR: /app/private_storage
      SESSION_COOKIE_SECURE: "false" # Set true behind HTTPS reverse proxy
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    volumes:
      - private_storage_data:/app/private_storage
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  private_storage_data:
