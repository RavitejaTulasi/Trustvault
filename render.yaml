services:
  - type: web
    name: trustvault-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The image contains the public Supabase root CA at
    # /app/certs/prod-ca-2021.crt, so both this pre-deploy instance and the
    # running service can read the same sslrootcert path.
    preDeployCommand: alembic -c /app/alembic.ini upgrade head
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Demo login is staging-only and must remain disabled in this blueprint.
      - key: DEMO_LOGIN_ENABLED
        value: "false"
      # Supabase Session Pooler (IPv4) URL for the application database:
      # postgresql+psycopg://postgres.<APP_PROJECT_REF>:<password>@<APP_POOLER_HOST>:5432/postgres?sslmode=verify-full&sslrootcert=/app/certs/prod-ca-2021.crt
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: supabase
      - key: STORAGE_DIR
        value: /var/data/private_storage
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: MAX_FILE_SIZE_BYTES
        value: "10485760"
      - key: MAX_MULTIPART_OVERHEAD_BYTES
        value: "1048576"
      - key: MAX_JSON_BODY_BYTES
        value: "65536"
      - key: STORAGE_ORPHAN_GRACE_SECONDS
        value: "3600"
      - key: MAX_USER_STORAGE_BYTES
        value: "104857600"
      - key: MAX_GLOBAL_STORAGE_BYTES
        value: "1073741824"
      - key: MAX_UPLOADS_PER_USER
        value: "1000"
      - key: AUDIT_RETENTION_DAYS
        value: "2555"
      - key: AUDIT_RETENTION_AUTO_DELETE
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_HTTPONLY
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      # Same-origin by default. Update if the service URL changes or a custom
      # domain is added.
      - key: CORS_ORIGINS
        value: https://trustvault-backend.onrender.com
      - key: AUDIT_ANCHOR_MODE
        value: postgresql
      # A separately administered PostgreSQL host for the audit anchor. A
      # second Supabase project in a different region works; same-region
      # projects can share a pooler host and are rejected at startup.
      # postgresql+psycopg://trustvault_anchor_app.<ANCHOR_PROJECT_REF>:<password>@<ANCHOR_POOLER_HOST>:5432/postgres?sslmode=verify-full&sslrootcert=/app/certs/prod-ca-2021.crt
      - key: AUDIT_ANCHOR_DATABASE_URL
        sync: false
      # Generated once and persisted. If migrating an existing deployment,
      # enter its current key manually instead so old checkpoints stay valid.
      - key: AUDIT_ANCHOR_HMAC_KEY
        generateValue: true
      - key: AUDIT_CHECKPOINT_INTERVAL_SECONDS
        value: "3600"
      - key: AUDIT_CHECKPOINT_MAX_AGE_SECONDS
        value: "7200"
      # Leave forwarded headers untrusted until exact Render proxy CIDRs are
      # verified. The app safely ignores X-Forwarded-For while this is empty.
      - key: TRUSTED_PROXY_IPS
        value: ""
      - key: TRUSTVAULT_MIGRATE_ON_START
        value: "true"
    # Upload staging only; documents are stored in Supabase Storage.
    disk:
      name: private-storage
      mountPath: /var/data/private_storage
      sizeGB: 1

databases:
  # Unused when DATABASE_URL points at Supabase. Retained until the operator
  # explicitly confirms the resource is safe to remove; it can be deleted from
  # the Render dashboard after the Supabase-backed deployment is verified.
  - name: trustvault-postgres
    databaseName: trustvault_db
    user: trustvault_user
    plan: starter
