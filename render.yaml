services:
  - type: web
    name: trustvault-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: alembic -c /app/alembic.ini upgrade head
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: supabase
      - key: STORAGE_DIR
        value: /var/data/private_storage
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: MAX_FILE_SIZE_BYTES
        value: "10485760"
      - key: MAX_MULTIPART_OVERHEAD_BYTES
        value: "1048576"
      - key: MAX_JSON_BODY_BYTES
        value: "65536"
      - key: STORAGE_ORPHAN_GRACE_SECONDS
        value: "3600"
      - key: MAX_USER_STORAGE_BYTES
        value: "104857600"
      - key: MAX_GLOBAL_STORAGE_BYTES
        value: "1073741824"
      - key: MAX_UPLOADS_PER_USER
        value: "1000"
      - key: AUDIT_RETENTION_DAYS
        value: "2555"
      - key: AUDIT_RETENTION_AUTO_DELETE
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_HTTPONLY
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: CORS_ORIGINS
        value: https://trustvault-backend.onrender.com
      - key: AUDIT_ANCHOR_MODE
        value: postgresql
      - key: AUDIT_ANCHOR_DATABASE_URL
        sync: false
      - key: AUDIT_ANCHOR_HMAC_KEY
        sync: false
      - key: AUDIT_CHECKPOINT_INTERVAL_SECONDS
        value: "3600"
      - key: AUDIT_CHECKPOINT_MAX_AGE_SECONDS
        value: "7200"
      # Leave forwarded headers untrusted until exact Render proxy CIDRs are
      # verified. The app safely ignores X-Forwarded-For while this is empty.
      - key: TRUSTED_PROXY_IPS
        value: ""
    disk:
      name: private-storage
      mountPath: /var/data/private_storage
      sizeGB: 10

databases:
  # Retained until the operator explicitly confirms the resource is safe to remove.
  - name: trustvault-postgres
    databaseName: trustvault_db
    user: trustvault_user
    plan: starter
